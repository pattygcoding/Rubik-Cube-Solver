name: Deploy to GitHub Pages

# The published site is a build artifact, not the repository root: every push to
# `main` runs the solver's Rust tests, builds the SvelteKit site into `build/` and
# hands that folder to Pages. See README.md ("Deploying to GitHub Pages") for the
# one-time switch that turns this on.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time, and never cancel one that is already running - a
# half-published site is worse than a slightly older one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    test:
        name: Rust solver tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            # The crate carries its own unit tests (move semantics, coordinates,
            # table sizes, the two-phase search). They run on the host, so no
            # wasm32 target is needed - `cargo test --release` is what
            # `npm run wasm:test` runs locally.
            - run: cargo test --manifest-path wasm-solver/Cargo.toml --release

    build:
        name: Build the site
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            # `enablement` lets this job create the Pages site itself, so a fresh
            # clone or fork does not need the one-time settings step first.
            - uses: actions/configure-pages@v5
              with:
                  enablement: true
            # The wasm-bindgen output is committed under src/lib/wasm-solver, so the
            # build needs Node only: no Rust toolchain and no wasm-pack in CI.
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
